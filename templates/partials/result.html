<div class="border border-white/30 p-3">
  <img src="data:image/webp;base64,{{ gif_data }}" alt="generated clip" class="w-full border border-white/10 mb-2">
  <div class="flex items-center justify-between text-xs text-white/60">
    <span>{{ size_kb }} kb</span>
    <a class="border border-white/40 px-2 py-1 hover:bg-white hover:text-black transition"
       href="data:image/webp;base64,{{ gif_data }}" download="{{ filename }}">
      download
    </a>
  </div>
</div>
